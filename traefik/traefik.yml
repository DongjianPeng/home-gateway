# Traefik 静态配置。动态路由不写在这里，全由各容器的 label 声明，见 README「接入一个服务」
entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # 只路由显式标了 traefik.enable=true 的容器
    exposedByDefault: false
    watch: true

api:
  dashboard: true

log:
  level: INFO

accessLog: {}
